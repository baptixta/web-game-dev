<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Grid</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="item item-1 navbar">
            <ul>
                <li>Home</li>
                <li>Sobre Mim</li>
                <li>Contato</li>
            </ul>
        </div>
        <div class="item item-2 aside">aside</div>
        <div class="item item-3 section">
        </div>
        <div class="item item-4 footer">footer</div>
    </div>

    <div class="container-grid-item">
        <header class="special-item">header</header>
        <aside class="special-item">aside</aside>
        <section class="special-item">section</section>
        <article class="special-item article">article</article>
        <footer class="special-item">footer</footer>
    </div>
</body>
</html>
